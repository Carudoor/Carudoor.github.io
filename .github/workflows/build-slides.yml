name: Build slides from PPTX/PDF

on:
  push:
    paths:
      - 'slides/**.pptx'
      - 'slides/**.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils

      # 이미지 파일 접두어에 확장자를 포함시킨다(deck_pptx / deck_pdf).
      # 같은 이름의 pptx와 pdf가 함께 있어도 서로 덮어쓰지 않게 하기 위함이며,
      # scripts/extract_transitions.py도 동일한 규칙으로 이미지를 찾는다.
      #
      # 이미지를 통째로 지우지 않고 "이번에 다시 만들 접두어"만 지운다.
      # 원본이 너무 커서 로컬에서 미리 PNG로 변환해 넣어둔 덱(*_manual-N.png)이
      # 함께 들어 있는데, 전체 삭제를 하면 그게 같이 날아가기 때문이다.
      - name: Convert PPTX and PDF files to slide images
        run: |
          set -e
          mkdir -p slides/images
          shopt -s nullglob

          for f in slides/*.pptx; do
            base=$(basename "$f")
            stem="${base%.*}"
            echo "Converting (pptx) $f"
            rm -f "slides/images/${stem}_pptx-"*.png
            soffice --headless --norestore --convert-to pdf --outdir /tmp "$f"
            pdftoppm -png -r 150 "/tmp/${stem}.pdf" "slides/images/${stem}_pptx"
          done

          for f in slides/*.pdf; do
            base=$(basename "$f")
            stem="${base%.*}"
            echo "Converting (pdf) $f"
            rm -f "slides/images/${stem}_pdf-"*.png
            pdftoppm -png -r 150 "$f" "slides/images/${stem}_pdf"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python-pptx
        run: pip install python-pptx

      - name: Extract native transitions and build manifest
        run: python3 scripts/extract_transitions.py

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add slides/images slides/manifest.json
          git diff --staged --quiet || git commit -m "Auto-build slide images from PPTX/PDF [skip ci]"
          git push
