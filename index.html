<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이용수</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-card: #171a21;
    --text: #eef0f4;
    --muted: #9aa2b1;
    --accent: #5b8def;
    --border: #262b36;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 80px 24px 40px;
  }

  header h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header p.tagline {
    margin-top: 8px;
    color: var(--muted);
    font-size: 1.05rem;
  }

  nav {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 24px;
    display: flex;
    gap: 20px;
    border-bottom: 1px solid var(--border);
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    padding-bottom: 12px;
  }

  nav a:hover {
    color: var(--text);
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  section {
    margin-bottom: 48px;
  }

  section h2 {
    font-size: 1.1rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  .about p {
    color: var(--text);
    font-size: 1rem;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }

  .edu-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
  }

  .edu-item .school {
    font-weight: 600;
    font-size: 1.05rem;
  }

  .edu-item .major {
    color: var(--muted);
    font-size: 0.95rem;
  }

  .edu-item .period {
    color: var(--muted);
    font-size: 0.88rem;
    white-space: nowrap;
  }

  .contact-list {
    list-style: none;
  }

  .contact-list li {
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .contact-list a {
    color: var(--text);
    text-decoration: none;
  }

  .contact-list a:hover {
    color: var(--accent);
  }

  .btn-link {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 16px;
  }

  .btn-link:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .model-preview {
    position: relative;
    width: 100%;
    height: 260px;
    border-radius: 8px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #131722 0%, #0b0d12 70%);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .model-preview canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .model-preview-status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.85rem;
    pointer-events: none;
  }

  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <h1>이용수</h1>
  <p class="tagline">개인 홈페이지에 오신 것을 환영합니다.</p>
</header>

<nav>
  <a href="#about">소개</a>
  <a href="#education">학력사항</a>
  <a href="#models">3D 모델</a>
  <a href="#contact">연락처</a>
</nav>

<main>
  <section id="about" class="about">
    <h2>소개</h2>
    <p>안녕하세요, 이용수입니다. 이곳은 저를 소개하는 개인 홈페이지입니다.</p>
  </section>

  <section id="education">
    <h2>학력사항</h2>
    <div class="card">
      <div class="edu-item">
        <div>
          <div class="school">단국대학교</div>
          <div class="major">도시계획학과</div>
        </div>
        <div class="period"></div>
      </div>
    </div>
  </section>

  <section id="models">
    <h2>3D 모델</h2>
    <div class="card">
      <div class="model-preview" id="modelPreview">
        <div class="model-preview-status" id="modelPreviewStatus">모델 불러오는 중…</div>
      </div>
      <p style="margin-bottom: 14px;">STL 3D 모델을 홀로그램 스타일로 볼 수 있는 뷰어입니다.</p>
      <a href="viewer.html" class="btn-link">전체 뷰어 열기 →</a>
    </div>
  </section>

  <section id="contact">
    <h2>연락처</h2>
    <ul class="contact-list">
      <li>Email: <a href="mailto:yongsoo.b.lee@gmail.com">yongsoo.b.lee@gmail.com</a></li>
    </ul>
  </section>
</main>

<footer>
  &copy; 2026 이용수. All rights reserved.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="stl-core.js"></script>
<script>
// Small teaser preview embedded on the homepage — same STL parser
// (stl-core.js) as the full viewer.html, just a lightweight scene.
(function () {
  var container = document.getElementById('modelPreview');
  var statusEl = document.getElementById('modelPreviewStatus');
  if (!container || typeof THREE === 'undefined') return;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8899aa, 1.1));
  var keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(4, 6, 6);
  scene.add(keyLight);
  var rimLight = new THREE.DirectionalLight(0x5b8def, 0.8);
  rimLight.position.set(-5, -2, -4);
  scene.add(rimLight);

  var modelGroup = new THREE.Group();
  scene.add(modelGroup);

  fetch('stl/small-city.stl', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.arrayBuffer();
    })
    .then(function (buffer) {
      var geometry = parseSTL(buffer);
      geometry.computeBoundingBox();
      var box = geometry.boundingBox;
      var center = new THREE.Vector3();
      box.getCenter(center);
      geometry.translate(-center.x, -center.y, -center.z);

      var size = new THREE.Vector3();
      box.getSize(size);
      var maxDim = Math.max(size.x, size.y, size.z) || 1;
      modelGroup.scale.setScalar(4 / maxDim);

      var material = new THREE.MeshPhongMaterial({
        color: 0x1c2b45,
        emissive: 0x25406e,
        emissiveIntensity: 0.4,
        specular: 0x5b8def,
        shininess: 60
      });
      modelGroup.add(new THREE.Mesh(geometry, material));

      var edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry, 20),
        new THREE.LineBasicMaterial({ color: 0x8fb0ff, transparent: true, opacity: 0.5 })
      );
      modelGroup.add(edges);

      camera.position.set(4, 3.2, 5);
      camera.lookAt(0, 0, 0);

      statusEl.style.display = 'none';
      animate();
    })
    .catch(function (err) {
      console.error(err);
      statusEl.textContent = '모델을 불러올 수 없습니다.';
    });

  function animate() {
    requestAnimationFrame(animate);
    modelGroup.rotation.y += 0.006;
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function () {
    var w = container.clientWidth, h = container.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();
</script>
</body>
</html>
